# Scala Steward repository-specific configuration.
# https://scala-steward.org/docs/repo-specific-configuration.html

pullRequests = {
  frequency = "7 days"

  grouping = [
    { name = "all", title = "Dependency updates", filter = [{ group = "*" }] }
  ]
}

updates.ignore = [
  # Updates to Scala need to be done by hand and carefully, as those need to match
  # the respective version SBT was compiled against.
  {
    groupId = "org.scala-lang"
    artifactId = "scala-library"
  }
  {
    groupId = "org.scala-lang"
    artifactId = "scala3-library"
  }
  {
    # The scalafmt version is pinned to the one that nixpkgs' `scalafmt` package
    # can run without network access, so that the sandboxed `nix flake check`
    # (treefmt) works. Bumping it makes `nix flake check` fail with a coursier
    # resolution error.
    groupId = "org.scalameta"
    artifactId = "scalafmt-core"
  }
]
